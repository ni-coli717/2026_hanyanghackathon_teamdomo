# Copy to secrets.toml locally; never commit actual secrets.
APP_ENV = "local" # cloud for independently deployed apps
DATA_MODE = "demo" # demo (immutable scenario) or live (resident submissions)
MEASUREMENT_APP_URL = "http://localhost:8502"

[database]
url = "" # https://YOUR_PROJECT.supabase.co
key = "" # server-only service role key; never paste into query parameters

[admin]
password_hash = "" # generated by python -m core.auth

# 기록 앱 로그인(참여자 코드 → PIN 해시). python -m core.auth participant 로 생성. 비어 있으면 코드만으로 입장(로그인 미설정 표시).
# REQUIRE_GPS = "0" 은 테스트·시연 전용: 구역 수동 선택, location_check='unverified'. 운영에서는 설정하지 않는다(기본 1).
[participants]
# P01 = "pbkdf2_sha256$600000$..."

[kma] # 기상청 단기예보(공공데이터포털). 없거나 실패하면 시연 예보로 표시됩니다.
service_key = "" # 디코딩된 서비스키
nx = 55 # 운양동 격자(Lambert 변환 확인)
ny = 129

# ---------------------------------------------------------------- 로그인 (2026-10-27)
# 카카오·구글은 Streamlit st.login(OIDC). 값은 각 개발자 콘솔에서 발급. 이 파일은 커밋하지 않는다.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"     # 배포 주소로 바꾼다. 콘솔의 Redirect URI 와 같아야 함
cookie_secret = "..."                                      # 아무 긴 무작위 문자열 (python -c "import secrets;print(secrets.token_hex(32))")
operators = ["운영자@example.com"]                         # 안내 탭에 USB 기기 패널이 보이는 계정

[auth.google]
client_id = "...apps.googleusercontent.com"
client_secret = "..."
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[auth.kakao]   # 카카오 developers: 앱 > 카카오 로그인 활성화, OpenID Connect 활성화, 보안 > Client Secret 생성, 동의항목 닉네임
client_id = "REST API 키"
client_secret = "..."
server_metadata_url = "https://kauth.kakao.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid profile_nickname", token_endpoint_auth_method = "client_secret_post" }
