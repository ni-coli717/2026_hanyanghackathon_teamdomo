# Copy to secrets.toml locally; never commit actual secrets.
APP_ENV = "local" # cloud for independently deployed apps
DATA_MODE = "demo" # demo (immutable scenario) or live (resident submissions)
MEASUREMENT_APP_URL = "http://localhost:8502"

[database]
url = "" # https://YOUR_PROJECT.supabase.co
key = "" # server-only service role key; never paste into query parameters

[admin]
password_hash = "" # generated by python -m core.auth

[kma] # 기상청 단기예보(공공데이터포털). 없거나 실패하면 시연 예보로 표시됩니다.
service_key = "" # 디코딩된 서비스키
nx = 55 # 운양동 격자 · 운영자 확인 필요
ny = 128
